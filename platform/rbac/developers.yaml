# Read-only access for developers to the app namespaces.
# Uses the built-in "view" ClusterRole: read most objects, but NOT Secrets,
# no create/update/delete, no exec, no port-forward.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developers-view
  namespace: web
subjects:
  - kind: Group
    name: secureshop-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developers-view
  namespace: app
subjects:
  - kind: Group
    name: secureshop-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
