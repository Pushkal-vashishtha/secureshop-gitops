# Alertmanager's whole config, generated from Parameter Store so neither the
# Gmail address nor its app password ever lands in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      data:
        alertmanager.yaml: |
          global:
            smtp_smarthost: smtp.gmail.com:587
            smtp_from: {{ .email }}
            smtp_auth_username: {{ .email }}
            smtp_auth_password: {{ .password }}
            smtp_require_tls: true
          route:
            receiver: email
            group_by: [alertname]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - receiver: "null"
                matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
          receivers:
            - name: "null"
            - name: email
              email_configs:
                - to: {{ .email }}
                  send_resolved: true
  data:
    - secretKey: email
      remoteRef: {key: /secureshop/dev/monitoring/alert_email}
    - secretKey: password
      remoteRef: {key: /secureshop/dev/monitoring/smtp_password}
