# Parameter Store, read with the box's instance role (via IMDS; only the ESO
# controller may reach it, see imds-guard.yaml). Usable from namespace "app" only.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  conditions:
    - namespaces: ["app", "monitoring"]
  provider:
    aws:
      service: ParameterStore
      region: ap-south-1
