# Block the EC2 metadata service (and with it, the box's IAM role) for every
# platform pod. Only the External Secrets controller may reach it.
# web/app are covered by their default-deny policies (Day 10).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-imds-egress
  namespace: argocd
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32]
    - to:
        - namespaceSelector: {}
---
