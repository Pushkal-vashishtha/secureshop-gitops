# Dedicated, token-less identity for the web tier (CIS 5.1.5).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: web
automountServiceAccountToken: false
---
# Default service accounts never mount tokens (CIS 5.1.5 / 5.1.6).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: app
automountServiceAccountToken: false
